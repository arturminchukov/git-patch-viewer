<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Git Patch Viewer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #1f2328;
        --muted: #656d76;
        --accent: #1f6feb;
        --border: #d0d7de;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --text: #e6edf3;
          --muted: #8b949e;
          --accent: #388bfd;
          --border: #30363d;
        }
      }
      body {
        margin: 0;
        width: 300px;
        padding: 14px 16px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      h1 { font-size: 14px; margin: 0 0 8px; }
      #status { margin: 0 0 12px; color: var(--muted); }
      button {
        width: 100%;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
      }
      button[hidden] { display: none; }
      #toggle {
        color: #fff;
        background: var(--accent);
        border: none;
      }
      #toggle[data-on="true"] {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      #open {
        margin-top: 8px;
        color: var(--accent);
        background: transparent;
        border: 1px solid var(--border);
      }
      .hint { margin: 12px 0 0; font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <h1>Git Patch Viewer</h1>
    <p id="status">…</p>
    <button id="toggle" type="button">…</button>
    <button id="open" type="button" hidden>Open patch in a new tab</button>
    <p class="hint">
      Access to GitHub/GitLab is requested only when you enable the button, and
      can be turned off here at any time.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
