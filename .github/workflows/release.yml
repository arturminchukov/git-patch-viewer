name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    # Store credentials are optional: the publish steps are skipped until the
    # corresponding repository secrets are configured.
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test
        run: yarn test

      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: yarn build
        env:
          GPV_VERSION: ${{ env.VERSION }}

      - name: Package builds
        run: |
          cd dist-chrome && zip -r "../git-patch-viewer-chrome-${VERSION}.zip" . && cd ..
          cd dist-firefox && zip -r "../git-patch-viewer-firefox-${VERSION}.zip" . && cd ..

      - name: Package source (for AMO reviewers)
        run: node scripts/package-source.mjs
        env:
          GPV_VERSION: ${{ env.VERSION }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            git-patch-viewer-chrome-${{ env.VERSION }}.zip
            git-patch-viewer-firefox-${{ env.VERSION }}.zip
            release/git-patch-viewer-source-${{ env.VERSION }}.zip

      - name: Publish to Firefox Add-ons (AMO)
        if: ${{ env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != '' }}
        run: >
          npx --yes web-ext@latest sign
          --source-dir dist-firefox
          --channel listed
          --api-key "$AMO_JWT_ISSUER"
          --api-secret "$AMO_JWT_SECRET"

      - name: Publish to Chrome Web Store
        if: ${{ env.CWS_EXTENSION_ID != '' }}
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: git-patch-viewer-chrome-${{ env.VERSION }}.zip
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
